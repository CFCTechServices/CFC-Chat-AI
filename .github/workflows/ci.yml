name: CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet test CFC.ChatAI.slnx -c Release
      - run: node --test tests/CFC.ChatAI.Web.Tests/frontend-browser.test.mjs tests/CFC.ChatAI.Web.Tests/supabase-auth.test.mjs
      - run: ./deployment/Publish-DotnetIis.ps1 -ReleasePath (Join-Path $env:RUNNER_TEMP 'cfcchat-iis')

  supabase-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/check_supabase_boundary.py
